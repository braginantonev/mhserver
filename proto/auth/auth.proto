syntax = "proto3";
package data;
option go_package = "github.com/braginantonev/mhserver/proto/gen/auth";

import "google/protobuf/empty.proto";

service AuthService {
    rpc Login(User) returns (LoginResponse);
    rpc Register(RegisterRequest) returns (google.protobuf.Empty);
}

message User {
    string login = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}

message RegisterRequest {
    User user = 1;
    string secret_key = 2;
}
