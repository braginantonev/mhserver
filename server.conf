[server]
address = "localhost" # domain or ip
port = 30543

[ratelimiter.unary]
limit = 5
interval = 1 # secs

[ratelimiter.stream]
limit = 100
interval = 1 # secs

[services.files]
enabled = true

[services.music]
enabled = true

[services.music.dependencies]
files = { address = "localhost", port = 30543 }

[services.images]
enabled = false

[services.images.dependencies]
files = { address = "localhost", port = 30543 }

[services.llm]
enabled = false

[services.llm.dependencies]
files = { address = "localhost", port = 30543 }