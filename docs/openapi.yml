openapi: '3.0.3'

info:
  title: MHServer API
  version: '2.2.2'
  description: API для работы с MHServer (My Home Server)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: my.best.server
        description: Домен сервера

  - url: https://{host}:{port}/api/v1
    variables:
      host:
        default: localhost
        description: Имя сервера или его IP

      port:
        default: "8080"
        description: Порт сервера

tags:
  - name: Аутентификация
    description: Аутентификация и авторизация пользователей

  - name: Сервис
    description: Операции отвечающие за определённый функционал

  - name: Файлы
    description: Работа с файлами
  
  - name: Инструменты
    description: Инструменты сервера

paths:
  /tools/ping:
   post:
    operationId: ping
    tags: ["Инструменты"]
    summary: Приветствие
    description: Используется для пинга сервера

    responses:
      "200":
        description: Сервер доступен
        content:
          text/plain:
            schema:
              type: string
            example: Welcome to MHServer API
      
      "404":
        description: Сервер выключен

  /users/login:
    post:
      operationId: usersLogin
      tags: ["Аутентификация", "Сервис"]
      summary: Получение JWT пользователя

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginRequest"

      responses:
        "200":
          description: Получен JWT токен
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string
                format: jwt
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzExODY5MjAsImlhdCI6MTc3MTEwMDUyMCwibmFtZSI6IlRlc3QxIiwibmJmIjoxNzcxMTAwNTIwfQ.rRD0ViwdgZxd9GG9RbW5lzThlnMN_5yX4ngcdWMSyhw
        
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                emptyUsername:
                  $ref: "#/components/examples/EmptyUsername"

                emptyRequestBody:
                  $ref: "#/components/examples/EmptyRequestBody"

                badJsonSyntax:
                  $ref: "#/components/examples/BadJsonSyntax"

                notRegistered:
                  summary: Пользователь не зарегистрирован
                  value:
                    message: not registered
                    
                wrongPassword:
                  summary: Введён неверный пароль
                  value:
                    message: wrong password    
        
        "404":
          $ref: "#/components/responses/AuthServiceUnavailable"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"

        "500":
          $ref: "#/components/responses/InternalError" 

  /users/register:
    post:
      operationId: usersRegister
      tags: ["Аутентификация", "Сервис"]
      summary: Регистрация пользователя

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"

      responses:
        "200":
          description: Пользователь зарегистрирован
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
        
        "400":
          $ref: "#/components/responses/AuthRequestError"
        
        "403":
          description: Введённый секретный ключ не существует
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string
              example: wrong register secret key
        
        "404":
          $ref: "#/components/responses/AuthServiceUnavailable"
        
        "409":
          description: Пользователь уже зарегистрирован
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string
              example: user already exist
        
        "429":
          $ref: "#/components/responses/ToManyRequests"

        "500":
          $ref: "#/components/responses/InternalError"
  
  /files/connect:
    post:
      operationId: filesCreateConnection
      tags: ["Файлы", "Сервис"]
      summary: Получение параметров получения или отправки чанков
      description: |
        "Пропуск" к работе с файлами на сервере. Создаёт инструкцию для сервера, что конкретный файл будет использоваться (создание, изменение и т.д.). Без этой инструкции, работа с файлами не допускается.

        Также передаёт пользователю информацию о количестве чанков и их размере, необходимые для сохранения файла.

        Соединение существует 5 минут, либо пока файл не будет полностью сохранён (очевидно, при сохранении файла)
      
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ConnectionMode"       

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      
      responses:
        "200":
          description: Соединение создано и получены его параметры
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
                    
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"

                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"

                emptyRequestBody:
                  $ref: "#/components/examples/EmptyRequestBody"

                unspecifiedDirectory:
                  $ref: "#/components/examples/UnspecifiedDirectory"
                    
                directoryNotFound:
                  $ref: "#/components/examples/DirectoryNotFound"
                
                directoryBadSyntax:
                  $ref: "#/components/examples/DirectoryBadSyntax"
                
                emptyFilename:
                  $ref: "#/components/examples/EmptyFilename"
                
                nullSizeToSave:
                  $ref: "#/components/examples/NullSizeToSave"
        
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "413":
          description: Размер сохраняемого файла, больше свободного места на сервере
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string
              example: not enough disk space
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  
  /files/save:
    post:
      operationId: filesSaveChunk
      tags: ["Файлы", "Сервис"]
      summary: Сохранить часть файла
      description: |
        Сохраняет часть файла (чанк) на сервере. 
        
        Чтобы сохранить полный файл, необходимо отправить запрос столько раз, сколько указано в поле `chunksCount` созданного соединения.
      
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      
      security:
        - BearerAuth: []
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveChunk"
      
      responses:
        "200":
          description: Чанк сохранен
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"

                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"

                emptyRequestBody:
                  $ref: "#/components/examples/EmptyRequestBody"
                  
                badConnectionSyntax:
                  $ref: "#/components/examples/BadConnectionSyntax"
                    
                connectionNotExists:
                  $ref: "#/components/examples/ConnectionNotExists"
                  
                incorrectChunkSize:                  
                  $ref: "#/components/examples/IncorrectChunkSize"
                
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "403":
          $ref: "#/components/responses/UnexpectedFileChangeError"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"

        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  
  /files/get:
    get:
      operationId: filesGetChunk
      tags: ["Файлы", "Сервис"]
      summary: Получить часть файла
      description: |
        Запрос возвращает файл по чанкам. 

        Чтобы получить полный файл, необходимо отправить столько запросов, сколько записано в поле `chunksCount` при создании соединения
      
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/GetChunk"
      
      security:
        - BearerAuth: []
      
      responses:
        "200":
          description: Чанк получен
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/FilePart"
        
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"

                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"

                emptyRequestBody:
                  $ref: "#/components/examples/EmptyRequestBody"
                  
                badConnectionSyntax:
                  $ref: "#/components/examples/BadConnectionSyntax"
                    
                connectionNotExists:
                  $ref: "#/components/examples/ConnectionNotExists"
        
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  
  /files/sum:
    get:
      operationId: filesGetSum
      tags: ["Файлы", "Сервис"]
      summary: Получить контрольную сумму части файла
      description: |
        Используется проверки целлостности сохранённого файла. 
        
        Возвращает контрольную сумму чанка (не файла!), 
        поэтому, чтобы проверить целостность файла, необходимо сделать столько запросов, сколько указано в поле `chunksCount` при создании соединения.

        Контрольная сумма считается по алгоритму SHA-256.
      
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/GetChunk"
      
      security:
        - BearerAuth: []
      
      responses:
        "200":
          description: Контрольная сумма получена
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: uint8
        
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"

                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"

                emptyRequestBody:
                  $ref: "#/components/examples/EmptyRequestBody"
                
                badConnectionSyntax:
                  $ref: "#/components/examples/BadConnectionSyntax"
                  
                connectionNotExists:
                  $ref: "#/components/examples/ConnectionNotExists"
                  
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  
  /files:
    get:
      operationId: getFilesList
      tags: ["Файлы", "Сервис"]
      summary: Получить список файлов в каталоге

      parameters:
        - $ref: "#/components/parameters/Directory"
      
      security:
        - BearerAuth: []
      
      responses:
        "200":
          description: Список файлов получен
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesList"
        
        "400":
          $ref: "#/components/responses/FilesDirectoryError"
        
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  
  /files/space:
    get:      
      operationId: filesGetAvailableSpace
      tags: ["Файлы", "Сервис"]
      summary: Получить количество свободного места

      security:
        - BearerAuth: []

      responses:
        "200":
          description: Количество свободного места в байтах получен
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: integer
                format: int64
                minimum: 0
        
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"
                
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"
        
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  
  /files/mkdir:
    post:
      operationId: filesMakeDirectory
      tags: ["Файлы", "Сервис"]
      summary: Создать каталог

      parameters:
        - $ref: "#/components/parameters/Directory"
      
      security:
        - BearerAuth: []

      responses:
        "200":
          description: Каталог создан
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
        
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"
                
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"
                
                unspecifiedDirectory:
                  $ref: "#/components/examples/UnspecifiedDirectory"
                
                directoryBadSyntax:
                  $ref: "#/components/examples/DirectoryBadSyntax"
                
                directoryAlreadyExist:
                  $ref: "#/components/examples/DirectoryAlreadyExist"
        
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /files/rmdir:
    post:
      operationId: filesRemoveDirectory
      tags: ["Файлы", "Сервис"]
      summary: Удалить каталог

      parameters:
        - $ref: "#/components/parameters/Directory"
      
      security:
        - BearerAuth: []

      responses:
        "200":
          description: Каталог удалён
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
        
        "400":
          description: Плохой запрос
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"

          content:
            text/plain:
              schema:
                type: string

              examples:
                badJwtSignature:
                  $ref: "#/components/examples/BadJwtSignature"
                
                badJwtSyntax:
                  $ref: "#/components/examples/BadJwtSyntax"
                
                unspecifiedDirectory:
                  $ref: "#/components/examples/UnspecifiedDirectory"
                
                directoryBadSyntax:
                  $ref: "#/components/examples/DirectoryBadSyntax"
                
                directoryNotFound:
                  $ref: "#/components/examples/DirectoryNotFound"
        
        "401":
          $ref: "#/components/responses/NotAuthorized"
        
        "429":
          $ref: "#/components/responses/ToManyRequests"
        
        "500":
          $ref: "#/components/responses/InternalError"
        
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
                
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GetChunk:
      description: Индекс чанка файла, контрольную сумму нужно вернуть
      name: chunkID
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
        
    ConnectionID:
      description: UUID соединения, созданного с помощью `/files/connect`
      name: connID
      in: query
      required: true
      schema:
        type: string
        format: uuid
    
    Directory:
      description: |
        Каталог с файлами на сервере. 
        Параметр всегда должен начинаться с корневого каталога: `/`
      name: dir
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^/.*"
      example: "/docs/secrets/"
  
  headers:
    X-RateLimit-Limit:
      description: "Максимальное количество запросов в временном окне"
      schema:
        type: integer
        minimum: 0

    X-RateLimit-Remaining:
      description: "Оставшееся количество запросов клиента в временном окне"
      schema:
        type: integer
        minimum: 0
    
    X-RateLimit-Reset:
      description: "Время сброса текущего ограничения скорости в секундах в формате UTC"
      schema:
        type: integer
        format: int64
        minimum: 0
    
    Retry-After:
      description: "Время в секундах, которое необходимо подождать перед следующим запросом"
      schema:
        type: integer
        format: int32
        minimum: 0
  
  schemas:
    UserRegisterRequest:
      type: object
      required:
        - username
        - password
        - key

      properties:
        username:
          type: string
          maxLength: 30
          example: "Jeb Kerman"

        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          example: "123"
        
        key:
          type: string
          maxLength: 64
          example: 59addea5aacf5ccb832921cca9f2e22d04a47670202a3da9557bda9fc2578bf4

      example:
        $ref: "./examples/auth/register-request.json"
    
    UserLoginRequest:
      type: object
      required:
        - username
        - password
      
      properties:
        username:
          type: string
          example: "Maebara Keiichi"

        password:
          type: string
          format: password
          example: "123"
      
      example:
        $ref: "./examples/auth/login-request.json"
    
    ConnectionMode:
      description: |
        `RDWR` - подключение для создания, редактирования и чтения файлов. При использовании - обязательно указывать размер файла в теле запроса.
        `RDONLY` - подключение только для чтения фаилов. При использовании - указывать размер файла не обязательно.    

      type: string
      enum:
        - RDWR
        - RDONLY
    
    ConnectionRequest:
      type: object
      required:
        - directory
        - filename
      
      properties:
        directory:
          type: string
          example: "/test/"

        filename:
          type: string
          pattern: ^[.]?[\p{L} _\-\p{N}]+([.]\w+)+$
          example: "pentagon secrets.docx"
        
        size:
          type: integer
          format: int64
          minimum: 0
      
      example:
        $ref: "./examples/data/connection-request.json"
    
    ConnectionResponse:
      type: object
      readOnly: true      
      required:
        - UUID
        - chunkSize
        - chunksCount
      
      properties:
        UUID:
          type: string
          format: uuid
          example: 2dfab521-6eed-4202-a215-1c58284c9d79
        
        chunkSize:
          description: Размер части файла в байтах для записи или чтения
          type: integer
          format: int64
          minimum: 1
        
        chunksCount:
          description: Количество частей файлов доступных для записи
          type: integer
          format: int32
          minimum: 1
      
      example:
        $ref: "./examples/data/connection-response.json"
    
    SaveChunk:
      type: object
      required:
        - chunk
        - offset
      
      properties:
        chunk:
          description: base64 байтовая запись чанка файла
          type: string
          format: byte
        
        offset:
          description: Отступ от начала файла, после которого будет сохранён чанк
          type: integer
          format: int64
          minimum: 0
      
      example:
        $ref: "./examples/data/save-chunk-request.json"
    
    FilePart:
      description: base64 байтовая запись чанка файла
      type: string
      format: byte
    
    FilesList:
      type: array
      readOnly: true
      items:
        type: object
        required:
          - name
          - modTime
        
        properties:
          name:
            description: Имя файла
            type: string
            example: "cern secrets.docx"
          
          isDir:
            description: Каталог ли файл
            type: boolean
            example: true
          
          size:
            description: Размер файла в байтах
            type: integer
            format: int64
            minimum: 0
          
          modTime:
            description: UNIX время создания файла
            type: integer
            format: int64
            minimum: 0

        example:
          $ref: "./examples/data/files-response.json"

  examples:
    EmptyUsername:
      summary: Поле с именем пользователя - пустое
      value:
        message: username is empty
    
    # Общие примеры

    EmptyRequestBody:
      summary: Поле запроса - пустое
      value:
        message: request body empty

    BadJsonSyntax:
      summary: Ошибка в синтаксисе JSON
      value:
        message: bad request json body
    
    BadJwtSyntax:
      description: JWT записан в неправильной форме
      value:
        message: bad jwt token
    
    BadJwtSignature:
      description: JWT имеет неверную сигнатуру
      value:
        message: jwt signature is invalid
    
    EmptyAuthorizationField:
      description: Поле `Authorization` отсутствует, либо пустое
      value:
        message: user not authorized
    
    JwtIsExpired:
      description: JWT просрочен
      value:
        message: authorization expired
    
    # Примеры ответов файлового сервиса

    EmptyFilename:
      summary: Не указано имя файла
      value:
        message: file name is empty
    
    BadConnectionSyntax:
      summary: UUID соединения записан в неправильной форме
      value:
        message: bad connection uuid
    
    ConnectionNotExists:
      summary: Отсутствует соединение или оно не существует
      value:
        message: connection not found or ended
    
    UnspecifiedDirectory:
      description: Не указан каталог файла
      value:
        message: target directory is not specified
    
    IncorrectChunkSize:                  
      summary: Размер чанка больше, указанного в соединении
      value:
        message: incorrect chunk size
    
    DirectoryNotFound:
      description: Каталог не найден
      value:
        message: directory not found
    
    DirectoryBadSyntax:
      description: Не верный формат пути
      value:
        message: directory have bad syntax
    
    DirectoryAlreadyExist:
      description: Каталог уже существует
      value:
        message: directory already exist
    
    NullSizeToSave:
      description: Не указан размер сохраняемого файла
      value:
       message: null size to save

